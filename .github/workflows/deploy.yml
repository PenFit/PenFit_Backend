name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: penfit
          POSTGRES_USER: penfit
          POSTGRES_PASSWORD: penfit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U penfit -d penfit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        run: ./gradlew test --no-daemon
        env:
          DB_URL: jdbc:postgresql://localhost:5432/penfit
          DB_USERNAME: penfit
          DB_PASSWORD: penfit
          AI_BASE_URL: http://localhost:8000
          AI_INTERNAL_API_KEY: ci-test-key

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  build:
    name: 이미지 빌드와 푸시
    needs: test
    # OCI Ampere가 ARM64이므로 ARM 러너에서 네이티브로 빌드한다.
    # public 저장소는 ARM 러너가 무료라 QEMU 크로스 빌드를 쓸 이유가 없다.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름과 태그 결정
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${REPO_LOWER}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드와 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: OCI 배포
    needs: build
    # 서버가 준비되기 전에는 이 잡을 건너뛴다.
    # OCI 인스턴스와 시크릿 등록을 마친 뒤 저장소 변수 DEPLOY_ENABLED 를 true 로 설정하면 동작한다.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: 배포 설정 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile"
          target: "~/penfit"
          strip_components: 1
          overwrite: true

      - name: 환경변수 주입과 컨테이너 교체
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          # 서버에 값을 미리 만들어두지 않는다. 실제 값은 전부 GitHub Secrets 에서 내려온다.
          envs: PENFIT_IMAGE,PENFIT_DOMAIN,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,AI_BASE_URL,AI_INTERNAL_API_KEY,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            mkdir -p ~/penfit && cd ~/penfit

            # .env 는 매 배포마다 새로 쓴다. 소유자만 읽을 수 있게 권한을 제한한다.
            umask 077
            cat > .env <<ENVFILE
            PENFIT_IMAGE=${PENFIT_IMAGE}
            PENFIT_DOMAIN=${PENFIT_DOMAIN}
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            AI_BASE_URL=${AI_BASE_URL}
            AI_INTERNAL_API_KEY=${AI_INTERNAL_API_KEY}
            ENVFILE

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io

            echo "--- 컨테이너 상태 ---"
            docker compose -f docker-compose.prod.yml ps
        env:
          PENFIT_IMAGE: ${{ needs.build.outputs.image }}
          PENFIT_DOMAIN: ${{ vars.PENFIT_DOMAIN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_INTERNAL_API_KEY: ${{ secrets.AI_INTERNAL_API_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 헬스체크
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          script: |
            for i in $(seq 1 30); do
              if docker exec penfit-app curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "정상 기동 확인 (${i}회차)"
                exit 0
              fi
              sleep 5
            done
            echo "헬스체크 실패. 애플리케이션 로그를 출력한다."
            docker logs --tail 100 penfit-app
            exit 1
