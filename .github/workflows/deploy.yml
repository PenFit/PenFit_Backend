name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: penfit
          POSTGRES_USER: penfit
          POSTGRES_PASSWORD: penfit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U penfit -d penfit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        run: ./gradlew test --no-daemon
        env:
          DB_URL: jdbc:postgresql://localhost:5432/penfit
          DB_USERNAME: penfit
          DB_PASSWORD: penfit
          AI_BASE_URL: http://localhost:8000
          AI_INTERNAL_API_KEY: ci-test-key

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  build:
    name: 이미지 빌드와 푸시
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름과 태그 결정
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${REPO_LOWER}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드와 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: OCI 배포
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: 배포 설정 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile"
          target: "~/penfit"
          strip_components: 1
          overwrite: true

      - name: 컨테이너 교체
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          envs: PENFIT_IMAGE,PENFIT_DOMAIN,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,AI_BASE_URL,AI_INTERNAL_API_KEY,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd ~/penfit

            for name in PENFIT_IMAGE PENFIT_DOMAIN POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD AI_BASE_URL AI_INTERNAL_API_KEY; do
              eval "value=\${$name:-}"
              if [ -z "$value" ]; then
                echo "필수 값이 비어 있습니다: $name (GitHub Secrets/Variables 등록을 확인하세요)"
                exit 1
              fi
            done

            rm -f .env

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            export PENFIT_IMAGE PENFIT_DOMAIN POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD AI_BASE_URL AI_INTERNAL_API_KEY

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker logout ghcr.io
            docker image prune -f

            echo "--- 컨테이너 상태 ---"
            docker compose -f docker-compose.prod.yml ps
        env:
          PENFIT_IMAGE: ${{ needs.build.outputs.image }}
          PENFIT_DOMAIN: ${{ vars.PENFIT_DOMAIN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_INTERNAL_API_KEY: ${{ secrets.AI_INTERNAL_API_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 헬스체크
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          script: |
            for i in $(seq 1 30); do
              if docker exec penfit-app curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "정상 기동 확인 (${i}회차)"
                exit 0
              fi
              sleep 5
            done
            echo "헬스체크 실패. 애플리케이션 로그를 출력한다."
            docker logs --tail 100 penfit-app
            exit 1
