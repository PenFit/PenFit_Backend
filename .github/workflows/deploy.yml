name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: penfit
          POSTGRES_USER: penfit
          POSTGRES_PASSWORD: penfit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U penfit -d penfit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        run: ./gradlew test --no-daemon
        env:
          DB_URL: jdbc:postgresql://localhost:5432/penfit
          DB_USERNAME: penfit
          DB_PASSWORD: penfit
          AI_BASE_URL: http://localhost:8000
          AI_INTERNAL_API_KEY: ci-test-key
          JWT_SECRET: ci-test-jwt-secret-key-with-at-least-32-bytes
          JWT_ACCESS_EXPIRATION: 3600000
          JWT_REFRESH_EXPIRATION: 604800000
          KAKAO_CLIENT_ID: ci-test-client-id
          KAKAO_CLIENT_SECRET: ci-test-client-secret
          KAKAO_REDIRECT_URI: http://localhost:5173/oauth/kakao/callback

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  prepare:
    name: 이미지 이름 결정
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - id: name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

  build:
    name: 이미지 빌드 (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드와 다이제스트 푸시
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: 다이제스트 저장
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: 매니페스트 병합
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 생성
        id: tag
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ needs.prepare.outputs.image }}"
          docker buildx imagetools create \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          echo "image=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: 아키텍처 확인
        run: |
          docker buildx imagetools inspect "${{ needs.prepare.outputs.image }}:${{ github.sha }}"

  deploy:
    name: OCI 배포
    needs: merge
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: 배포 설정 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile"
          target: "~/penfit"
          strip_components: 1
          overwrite: true

      - name: 컨테이너 교체
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          envs: PENFIT_IMAGE,PENFIT_DOMAIN,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,AI_BASE_URL,AI_INTERNAL_API_KEY,JWT_SECRET,JWT_ACCESS_EXPIRATION,JWT_REFRESH_EXPIRATION,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_REDIRECT_URI,CORS_ALLOWED_ORIGINS,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd ~/penfit

            for name in PENFIT_IMAGE PENFIT_DOMAIN POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD AI_BASE_URL AI_INTERNAL_API_KEY JWT_SECRET JWT_ACCESS_EXPIRATION JWT_REFRESH_EXPIRATION KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET KAKAO_REDIRECT_URI CORS_ALLOWED_ORIGINS; do
              eval "value=\${$name:-}"
              if [ -z "$value" ]; then
                echo "필수 값이 비어 있습니다: $name (GitHub Secrets/Variables 등록을 확인하세요)"
                exit 1
              fi
            done

            rm -f .env

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            export PENFIT_IMAGE PENFIT_DOMAIN POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD AI_BASE_URL AI_INTERNAL_API_KEY
            export JWT_SECRET JWT_ACCESS_EXPIRATION JWT_REFRESH_EXPIRATION
            export KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET KAKAO_REDIRECT_URI CORS_ALLOWED_ORIGINS

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker logout ghcr.io
            docker image prune -f

            echo "--- 컨테이너 상태 ---"
            docker compose -f docker-compose.prod.yml ps
        env:
          PENFIT_IMAGE: ${{ needs.merge.outputs.image }}
          PENFIT_DOMAIN: ${{ vars.PENFIT_DOMAIN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_INTERNAL_API_KEY: ${{ secrets.AI_INTERNAL_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_EXPIRATION: ${{ vars.JWT_ACCESS_EXPIRATION }}
          JWT_REFRESH_EXPIRATION: ${{ vars.JWT_REFRESH_EXPIRATION }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ vars.KAKAO_REDIRECT_URI }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 헬스체크
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          script: |
            for i in $(seq 1 60); do
              if docker exec penfit-app curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "정상 기동 확인 (${i}회차)"
                exit 0
              fi
              sleep 3
            done
            echo "헬스체크 실패. 애플리케이션 로그를 출력한다."
            docker logs --tail 100 penfit-app
            exit 1
