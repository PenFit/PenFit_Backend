services:
  postgres:
    image: postgres:16-alpine
    container_name: penfit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-penfit}
      POSTGRES_USER: ${POSTGRES_USER:-penfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-penfit}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - penfit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-penfit} -d ${POSTGRES_DB:-penfit}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  penfit-postgres-data:
