spring:
  application:
    name: penfit
  profiles:
    active: dev   # 개발할 땐 dev, 배포할 땐 prod (배포 시 SPRING_PROFILES_ACTIVE 로 덮어씀)

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마 변경은 Flyway 마이그레이션으로만 한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 50
      min-spare: 5
    accept-count: 100
    max-connections: 200

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

penfit:
  ai:
    base-url: ${AI_BASE_URL}
    api-key: ${AI_INTERNAL_API_KEY}
    connect-timeout: 3s
    timeout:
      passport: 18s
      pension-plan: 18s
      product-recommendation: 13s
      spending-mission: 18s

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    com.penfit.penfit: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.penfit.penfit: INFO
